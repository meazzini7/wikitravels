name: Cron WikiTravels

# Sostituisce i Vercel Cron (stessi orari, UTC) per non consumare CPU su Vercel.
# Il repository è pubblico: i segreti stanno SOLO in Settings -> Secrets and
# variables -> Actions, mai nel codice; i log stampano solo l'esito dei job
# (vedi scripts/run-cron.ts).
#
# Nota GitHub: nei repository pubblici i workflow programmati vengono
# disattivati dopo 60 giorni senza alcuna attività nel repository; se succede
# basta riattivarli dalla scheda Actions. L'avvio può ritardare di qualche
# minuto rispetto all'orario indicato.
on:
  schedule:
    - cron: "30 6 1-31/2 * *" # article: giorni dispari
    - cron: "0 17 * * *" # report: ogni giorno
    - cron: "0 13 2-30/2 * *" # promo: giorni pari
  workflow_dispatch:
    inputs:
      job:
        description: "Job da eseguire"
        type: choice
        options:
          - article
          - promo
          - report

# Il job non scrive nulla sul repository: il token automatico resta in sola lettura.
permissions:
  contents: read

concurrency:
  group: wikitravels-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scegli il job
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            JOB="$INPUT_JOB"
          else
            case "$SCHEDULE" in
              "30 6 1-31/2 * *") JOB=article ;;
              "0 17 * * *") JOB=report ;;
              "0 13 2-30/2 * *") JOB=promo ;;
              *) echo "Schedule non riconosciuto: $SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Esegui job
        env:
          JOB: ${{ steps.pick.outputs.job }}
          # Firebase Admin: basta UNA delle tre varianti, la stessa che usi su
          # Vercel (vedi lib/firebase-admin.ts). Quelle non impostate restano vuote.
          FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_BASE64 }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ADMIN_REPORT_EMAIL: ${{ secrets.ADMIN_REPORT_EMAIL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          # Instagram: il collegamento (e il suo rinnovo automatico ogni 30 giorni)
          # sta in Firestore, config/instagram. Queste due servono solo come
          # ripiego se in Firestore non c'è ancora un collegamento; si possono
          # lasciare vuote. App ID e App Secret non servono ai job: restano su
          # Vercel, dove li usa la pagina di collegamento.
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npx tsx --conditions=react-server scripts/run-cron.ts "$JOB"
